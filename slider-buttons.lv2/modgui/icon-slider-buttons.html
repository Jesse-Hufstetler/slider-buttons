<div class="mod-pedal slider-buttons{{{cns}}}">
    <div mod-role="drag-handle" class="drag-handle"></div>

    <div class="title">SLIDER BUTTONS</div>

    <div class="meter"><div class="meter-fill"></div></div>
    <div class="out-value">0.00 V</div>

    <div class="btn up" mod-role="input-control-port" mod-widget="switch" mod-port-symbol="UpButton" title="Hold to raise the CV output">
        <i class="arrow"></i>
        <span>UP</span>
    </div>
    <div class="btn down" mod-role="input-control-port" mod-widget="switch" mod-port-symbol="DownButton" title="Hold to lower the CV output">
        <i class="arrow"></i>
        <span>DOWN</span>
    </div>

    <div class="knob-base"></div>
    <div class="knob" mod-role="input-control-port" mod-widget="film" mod-widget-rotation="270" mod-port-symbol="Speed" title="Speed (volts per second)"></div>
    <div class="knob-label">SPEED</div>
    <div class="knob-value" mod-role="input-control-value" mod-port-symbol="Speed"></div>

    <div class="out-label">CV OUT</div>
    <div class="mod-pedal-output">
        <div class="mod-output" mod-role="output-cv-port" mod-port-symbol="CvOutput" title="CV Output"></div>
    </div>
</div>
